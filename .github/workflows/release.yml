name: Automatic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read integration version
        id: version
        run: |
          VERSION=$(python - <<'PY'
          import json

          with open("custom_components/solar_inverter_modbus_tcp/manifest.json") as f:
              data = json.load(f)

          print(data["version"])
          PY
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check changelog
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import re
          import os
          import sys

          version = os.environ["VERSION"]

          with open("CHANGELOG.md", encoding="utf-8") as f:
              text = f.read()

          pattern = rf"(?ms)^## \[?{re.escape(version)}\]?.*?(?=^## |\Z)"

          if not re.search(pattern, text):
              print(f"ERROR: CHANGELOG.md does not contain a section for version {version}")
              sys.exit(1)

          print(f"Found changelog entry for version {version}")
          PY

      - name: Extract changelog
        id: release_notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY' > release_notes.md
          import re
          import os
          import sys

          version = os.environ["VERSION"]

          with open("CHANGELOG.md", encoding="utf-8") as f:
              text = f.read()

          pattern = rf"(?ms)^## \[?{re.escape(version)}\]?.*?(?=^## |\Z)"
          match = re.search(pattern, text)

          if not match:
              print(f"ERROR: CHANGELOG.md does not contain version {version}", file=sys.stderr)
              sys.exit(1)

          print(match.group(0).strip())
          PY

      - name: Check release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.release.outputs.exists == 'false' && steps.tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release_notes.md \
            --target main

      - name: Update existing release
        if: steps.release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release edit "$VERSION" \
            --title "$VERSION" \
            --notes-file release_notes.md
