name: Automatic Release

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
      - custom_components/solar_inverter_modbus_tcp/manifest.json

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  release:
    name: Create Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read integration version
        id: version
        run: |
          VERSION=$(python - <<'PY'
          import json

          with open("custom_components/solar_inverter_modbus_tcp/manifest.json", encoding="utf-8") as f:
              data = json.load(f)

          print(data["version"])
          PY
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          version = os.environ["VERSION"]

          with open("CHANGELOG.md", encoding="utf-8") as f:
              text = f.read()

          pattern = rf"(?ms)^## \[?{re.escape(version)}\]?.*?(?=^## |\Z)"
          if not re.search(pattern, text):
              print(f"ERROR: CHANGELOG.md does not contain a section for version {version}")
              sys.exit(1)
          PY

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY' > release_notes.md
          import os
          import re
          import sys

          version = os.environ["VERSION"]

          with open("CHANGELOG.md", encoding="utf-8") as f:
              text = f.read()

          pattern = rf"(?ms)^## \[?{re.escape(version)}\]?.*?(?=^## |\Z)"
          match = re.search(pattern, text)
          if not match:
              print(f"ERROR: CHANGELOG.md does not contain version {version}", file=sys.stderr)
              sys.exit(1)

          print(match.group(0).strip())
          PY

      - name: Check existing release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "ERROR: GitHub release $VERSION already exists. Bump manifest.json version before releasing."
            exit 1
          fi

      - name: Check existing tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "$VERSION")
            if [ "$TAG_SHA" != "${GITHUB_SHA}" ]; then
              echo "ERROR: tag $VERSION already exists but points to $TAG_SHA instead of ${GITHUB_SHA}."
              exit 1
            fi
            echo "Tag $VERSION already points to this commit."
          else
            git tag "$VERSION" "$GITHUB_SHA"
            git push origin "$VERSION"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release_notes.md \
            --target "$GITHUB_SHA"
